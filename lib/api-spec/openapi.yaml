openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: OnCall Foot API — foot rejuvenation marketplace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: providers
    description: Provider discovery and provider portal
  - name: bookings
    description: Booking lifecycle
  - name: reviews
    description: Client reviews
  - name: invoices
    description: Payment invoices

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (client drops the token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Provider Discovery (public) ──────────────────────────────────────────────

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: Browse providers
      description: Public provider discovery with optional filters
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city (case-insensitive partial match)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by service category
        - name: verified
          in: query
          schema:
            type: boolean
          description: Only return verified providers
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"

  /providers/me:
    get:
      operationId: getMyProviderProfile
      tags: [providers]
      summary: Get own provider profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyProviderProfile
      tags: [providers]
      summary: Update own provider profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/services:
    get:
      operationId: listMyServices
      tags: [providers]
      summary: List own services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createService
      tags: [providers]
      summary: Add a new service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/services/{serviceId}:
    put:
      operationId: updateService
      tags: [providers]
      summary: Update a service
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteService
      tags: [providers]
      summary: Deactivate a service
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/availability:
    get:
      operationId: getMyAvailability
      tags: [providers]
      summary: Get own availability schedule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Availability slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setMyAvailability
      tags: [providers]
      summary: Replace own availability schedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityRequest"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/travel-zones:
    get:
      operationId: listMyTravelZones
      tags: [providers]
      summary: List own travel zones
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Travel zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelZoneListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTravelZone
      tags: [providers]
      summary: Add a travel zone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTravelZoneRequest"
      responses:
        "201":
          description: Travel zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelZoneResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/travel-zones/{zoneId}:
    delete:
      operationId: deleteTravelZone
      tags: [providers]
      summary: Remove a travel zone
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Travel zone removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/earnings:
    get:
      operationId: getMyEarnings
      tags: [providers]
      summary: Get earnings summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Earnings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/earnings/export:
    get:
      operationId: getMyEarningsExport
      tags: [providers]
      summary: Earnings statement export data (completed bookings only, read-only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Line items and totals for a printable earnings statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/verification:
    get:
      operationId: getMyVerification
      tags: [providers]
      summary: Get own verification docs and overall status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification status and submitted docs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: submitVerificationDoc
      tags: [providers]
      summary: Submit a credential document for admin review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVerificationDocRequest"
      responses:
        "201":
          description: Document submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/verification/queue:
    get:
      operationId: getAdminVerificationQueue
      tags: [admin]
      summary: List all pending verification documents (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Verification queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/verification/docs/{docId}:
    patch:
      operationId: reviewVerificationDoc
      tags: [admin]
      summary: Approve or reject a verification document (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewVerificationDocRequest"
      responses:
        "200":
          description: Document reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{providerId}:
    get:
      operationId: getProviderById
      tags: [providers]
      summary: Get a provider's public profile
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{providerId}/services:
    get:
      operationId: listProviderServices
      tags: [providers]
      summary: List a provider's active services
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Bookings ─────────────────────────────────────────────────────────────────

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List own bookings (scoped by role)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, confirmed, completed, cancelled, rescheduled, no_show]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request (client only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking detail (own only)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (role-restricted transitions)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Reviews ───────────────────────────────────────────────────────────────────

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review (client only, completed booking)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get review detail
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reviews/booking/{bookingId}:
    get:
      operationId: getBookingReview
      tags: [reviews]
      summary: Get the client's review for a booking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review for the booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Invoices ──────────────────────────────────────────────────────────────────

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List own invoices (scoped by role)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Invoices list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice detail (own only)
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{providerId}/reviews:
    get:
      operationId: listProviderReviews
      tags: [providers]
      summary: List a provider's visible reviews
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Provider reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRole:
      type: string
      enum: [client, provider, admin]

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - role
        - firstName
        - lastName

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          type: string
          enum: [client, provider]
          default: client
        phone:
          type: string
      required:
        - email
        - password
        - firstName
        - lastName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - token
        - user

    MeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: object
              properties:
                isActive:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
      required:
        - user

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - error

    # ── Provider Schemas ───────────────────────────────────────────────────────

    VerificationStatus:
      type: string
      enum: [pending, under_review, approved, rejected]

    ProviderSummary:
      type: object
      description: Condensed provider card for list views
      properties:
        id:
          type: integer
          description: provider_profiles.id
        userId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
        city:
          type: string
        rating:
          type: string
          description: Numeric string, e.g. "4.85"
        reviewCount:
          type: integer
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        acceptsNewClients:
          type: boolean
        yearsExperience:
          type: integer
          nullable: true
      required:
        - id
        - userId
        - firstName
        - lastName
        - title
        - city
        - rating
        - reviewCount
        - verificationStatus
        - acceptsNewClients

    ProviderProfile:
      description: Full provider profile including bio and service area
      allOf:
        - $ref: "#/components/schemas/ProviderSummary"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            serviceAreaNotes:
              type: string
              nullable: true
            profileComplete:
              type: boolean
            createdAt:
              type: string
              format: date-time

    ProviderProfileResponse:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderProfile"
      required:
        - provider

    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - providers
        - total
        - limit
        - offset

    UpdateProviderProfileRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        bio:
          type: string
        city:
          type: string
          minLength: 1
        serviceAreaNotes:
          type: string
        yearsExperience:
          type: integer
          minimum: 0
        acceptsNewClients:
          type: boolean

    # ── Service Schemas ────────────────────────────────────────────────────────

    Service:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        durationMinutes:
          type: integer
        priceCents:
          type: integer
          description: Price in cents (CAD)
        category:
          type: string
        eligibilityNotes:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - providerId
        - title
        - durationMinutes
        - priceCents
        - category
        - isActive

    ServiceResponse:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Service"
      required:
        - service

    ServiceListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
        - services

    CreateServiceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
        priceCents:
          type: integer
          minimum: 0
          description: Price in cents
        category:
          type: string
          default: foot_care
        eligibilityNotes:
          type: string
        isActive:
          type: boolean
          default: true
      required:
        - title
        - durationMinutes
        - priceCents

    UpdateServiceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
        priceCents:
          type: integer
          minimum: 0
        category:
          type: string
        eligibilityNotes:
          type: string
        isActive:
          type: boolean

    # ── Availability Schemas ───────────────────────────────────────────────────

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: integer
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = Sunday, 6 = Saturday"
        startTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        endTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      required:
        - id
        - dayOfWeek
        - startTime
        - endTime

    AvailabilityListResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
      required:
        - slots

    SetAvailabilityRequest:
      type: object
      description: Replaces all availability slots for the provider
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              startTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              endTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
            required:
              - dayOfWeek
              - startTime
              - endTime
      required:
        - slots

    # ── Travel Zone Schemas ────────────────────────────────────────────────────

    TravelZone:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        zoneName:
          type: string
        city:
          type: string
        notes:
          type: string
          nullable: true
      required:
        - id
        - providerId
        - zoneName
        - city

    TravelZoneResponse:
      type: object
      properties:
        zone:
          $ref: "#/components/schemas/TravelZone"
      required:
        - zone

    TravelZoneListResponse:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/TravelZone"
      required:
        - zones

    CreateTravelZoneRequest:
      type: object
      properties:
        zoneName:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        notes:
          type: string
      required:
        - zoneName
        - city

    # ── Review Schemas ─────────────────────────────────────────────────────────

    Review:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        clientFirstName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - clientId
        - providerId
        - rating
        - clientFirstName

    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - reviews
        - total
        - limit
        - offset

    # ── Booking Schemas ────────────────────────────────────────────────────────

    BookingStatus:
      type: string
      enum: [requested, confirmed, completed, cancelled, rescheduled, no_show]

    Booking:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        serviceId:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          nullable: true
        careNotes:
          type: string
          nullable: true
        clientNotes:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
          description: Client first name (joined; present on list responses)
        clientLastName:
          type: string
          nullable: true
          description: Client last name (joined; present on list responses)
        clientPhone:
          type: string
          nullable: true
          description: Client phone (joined; present on list responses)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - providerId
        - serviceId
        - status
        - scheduledAt
        - address
        - city

    BookingResponse:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
      required:
        - booking

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - bookings
        - total
        - limit
        - offset

    CreateBookingRequest:
      type: object
      properties:
        providerId:
          type: integer
          description: provider_profiles.id
        serviceId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postalCode:
          type: string
        careNotes:
          type: string
        clientNotes:
          type: string
      required:
        - providerId
        - serviceId
        - scheduledAt
        - address
        - city

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        cancellationReason:
          type: string
          description: Required when transitioning to cancelled
        scheduledAt:
          type: string
          format: date-time
          description: Required when transitioning to rescheduled
      required:
        - status

    # ── Review Schemas (create/get) ────────────────────────────────────────────

    ReviewResponse:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/Review"
      required:
        - review

    CreateReviewRequest:
      type: object
      properties:
        bookingId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
      required:
        - bookingId
        - rating

    # ── Invoice Schemas ────────────────────────────────────────────────────────

    InvoiceStatus:
      type: string
      enum: [pending, paid, cancelled]

    Invoice:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        amountCents:
          type: integer
          description: Amount in cents (CAD)
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - clientId
        - providerId
        - amountCents
        - status

    InvoiceResponse:
      type: object
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
      required:
        - invoice

    InvoiceListResponse:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - invoices
        - total
        - limit
        - offset

    # ── Earnings Schemas ───────────────────────────────────────────────────────

    EarningsSummaryResponse:
      type: object
      properties:
        totalCents:
          type: integer
          description: Lifetime earnings in cents
        completedBookings:
          type: integer
        pendingPayoutCents:
          type: integer
          description: Placeholder — Stripe Connect not yet active
      required:
        - totalCents
        - completedBookings
        - pendingPayoutCents

    EarningsExportItem:
      type: object
      properties:
        bookingId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        clientFirstName:
          type: string
        clientLastName:
          type: string
        serviceTitle:
          type: string
        amountCents:
          type: integer
      required:
        - bookingId
        - scheduledAt
        - clientFirstName
        - clientLastName
        - serviceTitle
        - amountCents

    EarningsExportResponse:
      type: object
      properties:
        provider:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            title:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
          required:
            - firstName
            - lastName
        generatedAt:
          type: string
          format: date-time
        totalCents:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/EarningsExportItem"
      required:
        - provider
        - generatedAt
        - totalCents
        - count
        - items

    # ── Verification / Credential Schemas ──────────────────────────────────────

    VerificationDocStatus:
      type: string
      enum: [pending, approved, rejected]

    VerificationDoc:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        docType:
          type: string
          description: e.g. "license", "insurance", "certification", "other"
        fileName:
          type: string
          description: URL or descriptive reference to the credential document
        status:
          $ref: "#/components/schemas/VerificationDocStatus"
        reviewerNotes:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - providerId
        - docType
        - fileName
        - status
        - submittedAt

    VerificationDocResponse:
      type: object
      properties:
        doc:
          $ref: "#/components/schemas/VerificationDoc"
      required:
        - doc

    VerificationStatusResponse:
      type: object
      properties:
        verificationStatus:
          type: string
          enum: [pending, under_review, approved, rejected]
        docs:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDoc"
      required:
        - verificationStatus
        - docs

    SubmitVerificationDocRequest:
      type: object
      properties:
        docType:
          type: string
          enum: [license, insurance, certification, other]
        fileName:
          type: string
          description: URL or descriptive reference to the document
        notes:
          type: string
          description: Optional context for the reviewer
      required:
        - docType
        - fileName

    AdminVerificationQueueItem:
      type: object
      properties:
        doc:
          $ref: "#/components/schemas/VerificationDoc"
        provider:
          type: object
          properties:
            id:
              type: integer
            userId:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            city:
              type: string
            verificationStatus:
              type: string
          required:
            - id
            - userId
            - firstName
            - lastName
            - email
            - city
            - verificationStatus
      required:
        - doc
        - provider

    AdminVerificationQueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminVerificationQueueItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    ReviewVerificationDocRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/VerificationDocStatus"
        reviewerNotes:
          type: string
        updateProviderStatus:
          type: string
          enum: [pending, under_review, approved, rejected]
          description: Optionally update the provider's overall verification status
      required:
        - status
