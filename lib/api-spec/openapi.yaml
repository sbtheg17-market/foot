          type: integer
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        acceptsNewClients:
          type: boolean
        yearsExperience:
          type: integer
          nullable: true
      required:
        - id
        - userId
        - firstName
        - lastName
        - title
        - city
        - rating
        - reviewCount
        - verificationStatus
        - acceptsNewClients

    ProviderProfile:
      description: Full provider profile including bio and service area
      allOf:
        - $ref: "#/components/schemas/ProviderSummary"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            serviceAreaNotes:
              type: string
              nullable: true
            profileComplete:
              type: boolean
            createdAt:
              type: string
              format: date-time

    ProviderProfileResponse:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderProfile"
      required:
        - provider

    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - providers
