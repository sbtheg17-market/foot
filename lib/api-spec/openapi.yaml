        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/reschedule-requests:
    post:
      operationId: createRescheduleRequest
      tags: [bookings]
      summary: Propose a new time (provider/admin; requires client consent)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRescheduleRequest"
      responses:
        "201":
          description: Proposal created (pending client consent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposalResponse"
        "200":
          description: Idempotent replay — the existing proposal for this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listRescheduleRequests
      tags: [bookings]
      summary: List reschedule proposals for an owned booking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposals (newest first, bounded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reschedule-requests/{requestId}/accept:
    post:
      operationId: acceptRescheduleRequest
      tags: [bookings]
      summary: Client accepts a proposed time (makes it the confirmed time)
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal accepted and booking time updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptRescheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /reschedule-requests/{requestId}/decline:
    post:
      operationId: declineRescheduleRequest
      tags: [bookings]
      summary: Client declines a proposal (or the proposer withdraws it)
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal resolved; the original appointment is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclineRescheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /bookings/{bookingId}/rescheduling-history:
    get:
      operationId: getReschedulingHistory
      tags: [bookings]
      summary: Append-only history of accepted time changes (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: integer
          description: Keyset cursor (id of the last row from the previous page)
      responses:
        "200":
          description: Rescheduling history, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReschedulingHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/cancellation-preview:
    get:
      operationId: getCancellationPreview
      tags: [bookings]
      summary: What cancelling right now would mean (owner only, server-computed)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancellation consequence preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/outcome-history:
    get:
      operationId: getOutcomeHistory
      tags: [bookings]
      summary: Append-only cancellation/no-show outcome history (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Outcome history, newest first (private fields admin-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Support (minimal, API-first — roadmap #13) ────────────────────────────────

  /support/contact:
    get:
      operationId: getSupportContact
      tags: [support]
      summary: Public support contact link (env-configured, pilot placeholder fallback)
      responses:
        "200":
          description: The support contact to render in public and portal footers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportContactResponse"

  /support/escalations:
    post:
      operationId: createSupportEscalation
      tags: [support]
      summary: Escalate a terminal booking to support (either party, idempotent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEscalationRequest"
      responses:
        "201":
          description: Escalation ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResponse"
        "200":
          description: An unresolved escalation for this booking already exists — returned as-is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /support/bookings/{bookingId}/escalations:
    get:
      operationId: getSupportBookingEscalations
      tags: [support]
      summary: Escalations + full outcome history for a booking (support/admin only, audit-logged)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Internal support view (never exposed to regular users)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportBookingEscalationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /support/escalations/{ticketId}:
    patch:
      operationId: updateSupportEscalation
      tags: [support]
      summary: Update escalation state, record mediation outcome, correct a booking, or suspend a party (support/admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEscalationRequest"
      responses:
        "200":
          description: Updated escalation (and corrected booking when requested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Reviews ───────────────────────────────────────────────────────────────────

  /reviews:
