        providerId:
          type: integer
        serviceId:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          nullable: true
        careNotes:
          type: string
          nullable: true
          description: Provider-private care note; included only in provider/admin responses
        clientNotes:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
          description: Client first name (joined; present on list responses)
        clientLastName:
          type: string
          nullable: true
          description: Client last name (joined; present on list responses)
        clientPhone:
          type: string
          nullable: true
          description: Client phone (joined; present on list responses)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - providerId
        - serviceId
        - status
        - scheduledAt
        - address
        - city

    BookingResponse:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
      required:
        - booking

    DuplicateBookingConflictResponse:
      type: object
      description: Returned when the client already has an active (requested, confirmed, or rescheduled) booking for the same provider, service, and scheduled time.
      properties:
        error:
          type: string
        bookingId:
          type: integer
          description: The id of the already-existing active booking
      required:
        - error
        - bookingId

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
