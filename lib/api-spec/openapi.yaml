  /providers/{providerId}/reviews:
    get:
      operationId: listProviderReviews
      tags: [providers]
      summary: List a provider's visible reviews
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Provider reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRole:
      type: string
      enum: [client, provider, admin]

    ProviderApplicationStatus:
      type: string
      enum: [draft, under_review, approved, rejected, suspended]

    ProviderApplicationStep:
      type: string
      enum: [profile, services, availability, verification, submitted]

    ProviderApplicationState:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - status
        - currentStep
        - submittedAt
        - reviewedAt

    ProviderApplicationProfile:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        bio:
          type: string
          nullable: true
        city:
          type: string
        serviceAreaNotes:
          type: string
          nullable: true
        yearsExperience:
          type: integer
          nullable: true
        profileComplete:
          type: boolean
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
      required:
        - id
        - title
        - bio
        - city
        - serviceAreaNotes
        - yearsExperience
        - profileComplete
        - verificationStatus

    ProviderApplicationPreviousSubmission:
      type: object
      description: |
        Immutable snapshot of a closed submission cycle. Written only when the
        owner resets a `rejected` application back to `draft`. Reviewer-private
        content (`reviewerNotes`) is never exposed here; only provider-visible
        fields are returned.
      properties:
        id:
          type: integer
        outcome:
          type: string
          enum: [rejected]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - outcome
        - submittedAt
        - reviewedAt
        - rejectionReason
        - createdAt

    ProviderApplicationNextAction:
      type: string
      enum:
        - resume_draft
        - wait_for_review
        - provider_operations_available
        - reset_to_draft
        - contact_support

    ProviderApplicationStatusView:
      type: object
      description: |
        Compact owner-scoped status projection of a provider application.
        Only exposes provider-visible fields; `reviewerNotes` never appears.
      properties:
        applicationId:
          type: integer
        status:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        submissionCount:
          type: integer
          minimum: 0
        latestSubmission:
          allOf:
            - $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
          nullable: true
        nextAction:
          $ref: "#/components/schemas/ProviderApplicationNextAction"
        canEdit:
          type: boolean
        canReset:
          type: boolean
        canResubmit:
          type: boolean
      required:
        - applicationId
        - status
        - currentStep
        - submittedAt
        - reviewedAt
        - rejectionReason
        - submissionCount
        - latestSubmission
        - nextAction
        - canEdit
        - canReset
        - canResubmit

    ProviderApplicationStatusResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ProviderApplicationStatusView"
      required:
        - status

    ProviderApplicationSubmissionsPagination:
      type: object
      description: Keyset pagination envelope for submission history.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - limit
        - hasMore
        - nextCursor

    ProviderApplicationSubmissionHistoryResponse:
      type: object
      description: |
        Owner-scoped submission history. `summary` is the same status
        projection returned by `GET /providers/application/status`;
        `submissions` is the newest-first, keyset-paginated list of closed
        rejected cycles.
      properties:
        summary:
          $ref: "#/components/schemas/ProviderApplicationStatusView"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
        pagination:
          $ref: "#/components/schemas/ProviderApplicationSubmissionsPagination"
      required:
        - summary
        - submissions
        - pagination

    ProviderNotification:
      type: object
      description: In-app provider notification derived from a lifecycle event.
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - submitted
            - reset_to_draft
            - approved
            - rejected
        title:
          type: string
        body:
          type: string
        link:
          type: string
          description: Provider-safe relative in-app path.
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - body
        - link
        - readAt
        - createdAt

    ProviderNotificationsPagination:
      type: object
      description: Keyset pagination envelope for notifications.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - limit
        - hasMore
        - nextCursor

    ProviderNotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/ProviderNotification"
        pagination:
          $ref: "#/components/schemas/ProviderNotificationsPagination"
      required:
        - notifications
        - pagination

    ProviderNotificationUnreadCountResponse:
      type: object
      properties:
        unreadCount:
          type: integer
      required:
        - unreadCount

    ProviderNotificationReadResponse:
      type: object
      properties:
        notification:
          $ref: "#/components/schemas/ProviderNotification"
      required:
        - notification

    ProviderApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ProviderApplicationState"
        - type: object
          properties:
            providerProfileId:
              type: integer
            profile:
              $ref: "#/components/schemas/ProviderApplicationProfile"
            rejectionReason:
              type: string
              nullable: true
              description: Provider-visible reason present while `status` is `rejected`. Cleared on reset back to `draft`; historical values remain in `previousSubmissions`.
            previousSubmissions:
              type: array
              description: Immutable history of closed submission cycles, ordered oldest to newest.
              items:
                $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
          required:
            - providerProfileId
            - profile
            - rejectionReason
            - previousSubmissions

    ProviderApplicationDetailResponse:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/ProviderApplicationDetail"
      required:
        - application

    UpdateProviderApplicationRequest:
      type: object
      properties:
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        title:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
          maxLength: 2000
        city:
          type: string
          minLength: 1
          maxLength: 120
        serviceAreaNotes:
          type: string
          maxLength: 2000
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 80

    ApplicationCompletion:
      type: object
      properties:
        profileComplete:
          type: boolean
        servicesComplete:
          type: boolean
        availabilityComplete:
          type: boolean
        verificationComplete:
          type: boolean
        readyForSubmission:
          type: boolean
        applicationStatus:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        missingRequirements:
          type: array
          items:
            type: string
          description: Human-readable list of missing required sections
      required:
        - profileComplete
        - servicesComplete
        - availabilityComplete
        - verificationComplete
        - readyForSubmission
        - applicationStatus
        - missingRequirements

    ApplicationCompletionResponse:
      type: object
      properties:
        completion:
          $ref: "#/components/schemas/ApplicationCompletion"
      required:
        - completion

    ProviderReadinessMissingCode:
      type: string
      description: >-
        Stable activation-readiness reason codes. Mirrors the readiness
        subset of the marketplace_event_reason_code enum; values are
        additive-only and never renamed or removed.
      enum:
        - NOT_APPROVED
        - PROFILE_INCOMPLETE
        - NO_ACTIVE_SERVICE
        - NO_AVAILABILITY
        - NO_SERVICE_AREA
        - NOT_ACCEPTING_CLIENTS
        - DOCS_PENDING

    ProviderReadinessCriteria:
      type: object
      description: Per-criterion activation booleans (C1–C7), each computed live from raw source fields.
      properties:
        approved:
          type: boolean
          description: C1 — provider application approved and profile verification approved
        profileComplete:
          type: boolean
          description: C2 — non-empty title, city, and bio, computed live (the stored profileComplete flag is never trusted)
        activeService:
          type: boolean
          description: C3 — at least one active service
        availability:
          type: boolean
          description: C4 — at least one availability slot
        serviceArea:
          type: boolean
          description: C5 — at least one travel zone (service area)
        acceptingClients:
          type: boolean
          description: C6 — provider is accepting new clients
        documents:
          type: boolean
          description: C7 — every platform-mandated document type has an approved verification document; auto-satisfied when no document type is mandated
      required:
        - approved
        - profileComplete
        - activeService
        - availability
        - serviceArea
        - acceptingClients
        - documents

    ProviderReadiness:
      type: object
      properties:
        activated:
          type: boolean
          description: Logical AND of criteria C1–C7
        missing:
          type: array
          description: Reason codes for unmet criteria, in deterministic C1→C7 order
          items:
            $ref: "#/components/schemas/ProviderReadinessMissingCode"
        criteria:
          $ref: "#/components/schemas/ProviderReadinessCriteria"
      required:
        - activated
        - missing
        - criteria

    ProviderReadinessResponse:
      type: object
      properties:
        readiness:
          $ref: "#/components/schemas/ProviderReadiness"
      required:
        - readiness

    ListingPreviewProfile:
      type: object
      properties:
        title: { type: string }
        bio: { type: string, nullable: true }
        city: { type: string }
        serviceAreaNotes: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        rating: { type: number, nullable: true }
        reviewCount: { type: integer }
        acceptsNewClients: { type: boolean }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
      required:
        - title
        - city
        - reviewCount
        - acceptsNewClients

    ListingPreviewService:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        durationMinutes: { type: integer }
        priceCents: { type: integer }
        category: { type: string }
      required:
        - id
        - title
        - durationMinutes
        - priceCents
        - category

    ListingPreviewSlotDay:
      type: object
      properties:
        date: { type: string }
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSlot"
      required:
        - date
        - slots

    ListingPreview:
      type: object
      properties:
        isPublic:
          type: boolean
          description: True only when the provider is approved and publicly bookable
        applicationStatus:
          type: string
          nullable: true
          enum: [draft, under_review, approved, rejected, suspended]
        verificationStatus:
          type: string
          enum: [pending, under_review, approved, rejected]
        timezone: { type: string }
        profile:
          $ref: "#/components/schemas/ListingPreviewProfile"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ListingPreviewService"
        availability:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityWindow"
        slotPreviewServiceId:
          type: integer
          nullable: true
        slotPreview:
          type: array
          items:
            $ref: "#/components/schemas/ListingPreviewSlotDay"
        readiness:
          allOf:
            - $ref: "#/components/schemas/ProviderReadiness"
          nullable: true
      required:
        - isPublic
        - verificationStatus
        - timezone
        - profile
        - services
        - availability
        - slotPreview

    ListingPreviewResponse:
      type: object
      properties:
        preview:
          $ref: "#/components/schemas/ListingPreview"
      required:
        - preview

    OnboardingState:
      type: object
      properties:
        client:
          type: string
          enum: [complete]
          nullable: true
        provider:
          $ref: "#/components/schemas/ProviderApplicationStatus"
          nullable: true
      required:
        - client
        - provider

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
          minItems: 1
        activeRole:
          $ref: "#/components/schemas/UserRole"
        onboarding:
          $ref: "#/components/schemas/OnboardingState"
        providerApplication:
          allOf:
            - $ref: "#/components/schemas/ProviderApplicationState"
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - role
        - roles
        - activeRole
        - onboarding
        - providerApplication
        - firstName
        - lastName

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          type: string
          enum: [client, provider]
          default: client
        roleIntent:
          type: string
          enum: [client, provider]
          description: Signup intent. The server derives initial membership and never treats this field as ongoing authorization.
        phone:
          type: string
      required:
        - email
        - password
        - firstName
        - lastName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - token
        - user

    MeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: object
              properties:
                isActive:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
      required:
        - user

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - error

    # ── Provider Schemas ───────────────────────────────────────────────────────

    VerificationStatus:
      type: string
      enum: [pending, under_review, approved, rejected]

    ProviderSummary:
      type: object
      description: Condensed provider card for list views
      properties:
        id:
          type: integer
          description: provider_profiles.id
        userId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
        city:
          type: string
        rating:
          type: string
          description: Numeric string, e.g. "4.85"
        reviewCount:
          type: integer
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        acceptsNewClients:
          type: boolean
        yearsExperience:
          type: integer
          nullable: true
      required:
        - id
        - userId
        - firstName
        - lastName
        - title
        - city
        - rating
        - reviewCount
        - verificationStatus
        - acceptsNewClients

    ProviderProfile:
      description: Full provider profile including bio and service area
      allOf:
        - $ref: "#/components/schemas/ProviderSummary"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            serviceAreaNotes:
              type: string
              nullable: true
            profileComplete:
              type: boolean
            createdAt:
              type: string
              format: date-time

    ProviderProfileResponse:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderProfile"
      required:
        - provider

    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - providers
        - total
        - limit
        - offset

    UpdateProviderProfileRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        bio:
          type: string
        city:
          type: string
          minLength: 1
        serviceAreaNotes:
          type: string
        yearsExperience:
          type: integer
          minimum: 0
        acceptsNewClients:
          type: boolean

    # ── Service Schemas ────────────────────────────────────────────────────────

    Service:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        durationMinutes:
          type: integer
        priceCents:
          type: integer
          description: Price in cents (CAD)
        category:
          type: string
        eligibilityNotes:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - providerId
        - title
        - durationMinutes
        - priceCents
        - category
        - isActive

    ServiceResponse:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Service"
      required:
        - service

    ServiceListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
        - services

    CreateServiceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
        priceCents:
          type: integer
          minimum: 0
          description: Price in cents
        category:
          type: string
          default: foot_care
        eligibilityNotes:
          type: string
        isActive:
          type: boolean
          default: true
      required:
        - title
        - durationMinutes
        - priceCents

    UpdateServiceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
        priceCents:
          type: integer
          minimum: 0
        category:
          type: string
        eligibilityNotes:
          type: string
        isActive:
          type: boolean

    # ── Availability Schemas ───────────────────────────────────────────────────

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: integer
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = Sunday, 6 = Saturday"
        startTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        endTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      required:
        - id
        - dayOfWeek
        - startTime
        - endTime

    AvailabilityListResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
      required:
        - slots

    SetAvailabilityRequest:
      type: object
      description: Replaces all availability slots for the provider
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              startTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              endTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
            required:
              - dayOfWeek
              - startTime
              - endTime
      required:
        - slots

    # ── Travel Zone Schemas ────────────────────────────────────────────────────

    TravelZone:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        zoneName:
          type: string
        city:
          type: string
        notes:
          type: string
          nullable: true
      required:
        - id
        - providerId
        - zoneName
        - city

    TravelZoneResponse:
      type: object
      properties:
        zone:
          $ref: "#/components/schemas/TravelZone"
      required:
        - zone

    TravelZoneListResponse:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/TravelZone"
      required:
        - zones

    CreateTravelZoneRequest:
      type: object
      properties:
        zoneName:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        notes:
          type: string
      required:
        - zoneName
        - city

    # ── Review Schemas ─────────────────────────────────────────────────────────

    Review:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        clientFirstName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - clientId
        - providerId
        - rating
        - clientFirstName

    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - reviews
        - total
        - limit
        - offset

    # ── Booking Schemas ────────────────────────────────────────────────────────

    ClientCareHistoryProvider:
      type: object
      description: Client-visible provider identity for a care-history entry
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
        city:
          type: string
      required:
        - id
        - firstName
        - lastName
        - title
        - city

    ClientCareHistoryService:
      type: object
      description: Client-visible service summary for a care-history entry
      properties:
        id:
          type: integer
        title:
          type: string
        durationMinutes:
          type: integer
        category:
          type: string
        priceCents:
          type: integer
          description: Price in cents (CAD)
      required:
        - id
        - title
        - durationMinutes
        - category
        - priceCents

    ClientCareHistoryEntry:
      type: object
      description: Client-safe booking history entry; never includes careNotes
      properties:
        id:
          type: integer
        providerId:
          type: integer
        serviceId:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          nullable: true
        clientNotes:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        provider:
          $ref: "#/components/schemas/ClientCareHistoryProvider"
        service:
          $ref: "#/components/schemas/ClientCareHistoryService"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - providerId
        - serviceId
        - status
        - scheduledAt
        - address
        - city
        - provider
        - service

    ClientCareHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/ClientCareHistoryEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - history
        - total
        - limit
        - offset

    BookingStatus:
      type: string
      enum: [requested, confirmed, completed, cancelled, rescheduled, no_show]

    Booking:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        serviceId:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          nullable: true
        careNotes:
          type: string
          nullable: true
          description: Provider-private care note; included only in provider/admin responses
        clientNotes:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: >-
            Privacy-safe allowlisted link attribution recorded at creation
            (instagram, qr-card, text, facebook, website); never exposed
            publicly and never used for authorization
        cancellationReason:
          type: string
          nullable: true
        cancellationCategory:
          type: string
          nullable: true
          description: >-
            Server-computed cancellation policy category (roadmap #13):
            client_cancelled_early, client_cancelled_late, provider_cancelled,
            or cancelled_by_support; null until the booking is cancelled
        noShowMarkedAt:
          type: string
          format: date-time
          nullable: true
          description: When the provider recorded a no-show; null otherwise
        clientFirstName:
          type: string
          nullable: true
          description: Client first name (joined; present on list responses)
        clientLastName:
          type: string
          nullable: true
          description: Client last name (joined; present on list responses)
        clientPhone:
          type: string
          nullable: true
          description: Client phone (joined; present on list responses)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - providerId
        - serviceId
        - status
        - scheduledAt
        - address
        - city

    BookingResponse:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
      required:
        - booking

    DuplicateBookingConflictResponse:
      type: object
      description: Returned when the client already has an active (requested, confirmed, or rescheduled) booking for the same provider, service, and scheduled time.
      properties:
        error:
          type: string
        bookingId:
          type: integer
          description: The id of the already-existing active booking
        reason:
          type: string
          enum: [duplicate_booking]
      required:
        - error
        - bookingId
        - reason

    ProviderUnavailableConflictResponse:
      type: object
      description: Returned when the requested interval overlaps another active booking for the same provider.
      properties:
        error:
          type: string
        reason:
          type: string
          enum: [provider_unavailable]
      required:
        - error
        - reason

    BookingRequestRejectedResponse:
      type: object
      description: Returned when a booking request is rejected before creation (invalid input or outside the provider's availability).
      properties:
        error:
          type: string
        reason:
          type: string
          enum: [invalid_request, outside_availability]
      required:
        - error
        - reason

    PublicAvailabilityWindow:
      type: object
      properties:
        dayOfWeek:
          type: integer
          description: 0 = Sunday … 6 = Saturday
        startTime:
          type: string
          description: Wall-clock start "HH:MM" in the effective marketplace timezone
        endTime:
          type: string
          description: Wall-clock end "HH:MM" in the effective marketplace timezone
      required:
        - dayOfWeek
        - startTime
        - endTime

    PublicAvailabilityResponse:
      type: object
      properties:
        timezone:
          type: string
          description: Effective IANA marketplace timezone
        windows:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityWindow"
      required:
        - timezone
        - windows

    # ── Provider booking page schemas (roadmap #11) ───────────────────────────

    BookingPageSettings:
      type: object
      description: Owner-scoped publish state for the provider's public booking page
      properties:
        slug:
          type: string
          nullable: true
          description: Canonical public slug; assigned at first publish, then immutable
        published:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        path:
          type: string
          nullable: true
          description: Canonical public path (/book/{slug}) once a slug exists
        eligible:
          type: boolean
          description: >-
            True when the provider is approved AND has an active service-area
            configuration with at least one covered postal area
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        serviceAreaConfigured:
          type: boolean
          description: >-
            True when an active service-area configuration with at least one
            covered postal area exists (publish prerequisite, roadmap #12)
      required:
        - slug
        - published
        - publishedAt
        - path
        - eligible
        - verificationStatus
        - serviceAreaConfigured

    MyBookingPageResponse:
      type: object
      properties:
        bookingPage:
          $ref: "#/components/schemas/BookingPageSettings"
      required:
        - bookingPage

    PublicBookingPageProvider:
      type: object
      description: Public-safe provider identity for the booking page (never exposes account/user ids)
      properties:
        id:
          type: integer
          description: provider_profiles.id — same public identifier used by marketplace discovery
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
        bio:
          type: string
          nullable: true
        city:
          type: string
        serviceAreaNotes:
          type: string
          nullable: true
        rating:
          type: string
          description: Numeric string, e.g. "4.85"
        reviewCount:
          type: integer
        yearsExperience:
          type: integer
          nullable: true
        acceptsNewClients:
          type: boolean
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
      required:
        - id
        - firstName
        - lastName
        - title
        - city
        - rating
        - reviewCount
        - acceptsNewClients
        - verificationStatus

    PublicBookingPage:
      type: object
      properties:
        slug:
          type: string
        provider:
          $ref: "#/components/schemas/PublicBookingPageProvider"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        availability:
          $ref: "#/components/schemas/PublicAvailabilityResponse"
        serviceArea:
          $ref: "#/components/schemas/PublicServiceAreaSummary"
        cancellationPolicy:
          $ref: "#/components/schemas/PublicCancellationPolicySummary"
      required:
        - slug
        - provider
        - services
        - availability
        - serviceArea
        - cancellationPolicy

    PublicCancellationPolicySummary:
      type: object
      description: >-
        Public cancellation policy summary (roadmap #13). Safe fields ONLY:
        the notice window and plain-language copy. Internal state identifiers,
        categories, and history are never exposed publicly.
      properties:
        noticeHours:
          type: integer
        summary:
          type: string
      required:
        - noticeHours
        - summary

    PublicServiceAreaSummary:
      type: object
      description: >-
        Public-safe service-area summary (roadmap #12). Contains ONLY the
        provider-written description and coarse public context — raw coverage
        entries (FSA prefixes) are never exposed publicly.
      properties:
        configured:
          type: boolean
          description: >-
            True when online eligibility checks are available for this page;
            false reports the `unavailable` state to clients
        description:
          type: string
          nullable: true
          description: Provider-written plain-language service-area summary
        countryCode:
          type: string
          nullable: true
        provinceCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
      required:
        - configured
        - description
        - countryCode
        - provinceCode
        - city

    ServiceAreaEligibilityState:
      type: string
      description: Server-authoritative service-area eligibility state (roadmap #12)
      enum: [eligible, ineligible, needs_review, invalid, unavailable]

    ServiceAreaCheckRequest:
      type: object
      description: >-
        Minimal client location input for the eligibility check. Validated
        server-side and NOT retained. No coordinates are ever collected.
      properties:
        country:
          type: string
          description: Country name or code (Canada-first; e.g. "CA", "Canada")
        province:
          type: string
          description: Province/territory code or name (e.g. "ON", "Ontario")
        city:
          type: string
          description: Optional city context
        postalCode:
          type: string
          description: Canadian postal code; normalized server-side
      required:
        - country
        - province
        - postalCode

    ServiceAreaEligibility:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ServiceAreaEligibilityState"
        reason:
          type: string
          description: >-
            Allowlisted machine reason code (safe next-step metadata):
            fsa_match, fsa_not_covered, country_not_served, province_mismatch,
            missing_location, malformed_postal_code, malformed_location,
            not_configured
        message:
          type: string
          description: Approved plain-language client-facing message
      required:
        - status
        - reason
        - message

    ServiceAreaCheckResponse:
      type: object
      properties:
        eligibility:
          $ref: "#/components/schemas/ServiceAreaEligibility"
      required:
        - eligibility

    MyServiceAreaPrefix:
      type: object
      properties:
        id:
          type: integer
        countryCode:
          type: string
        prefix:
          type: string
          description: Normalized Canadian FSA (first three postal characters)
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - countryCode
        - prefix
        - createdAt

    MyServiceArea:
      type: object
      description: Owner-scoped service-area configuration (roadmap #12)
      properties:
        configured:
          type: boolean
          description: Active configuration with at least one covered postal area
        isActive:
          type: boolean
        countryCode:
          type: string
        provinceCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        publicDescription:
          type: string
          nullable: true
        prefixes:
          type: array
          items:
            $ref: "#/components/schemas/MyServiceAreaPrefix"
        bufferMinutes:
          type: integer
          description: >-
            Centrally managed travel/setup buffer applied between this
            provider's appointments (default 30). Provider-specific overrides
            are not available in this release.
        bufferSource:
          type: string
          enum: [default, environment]
        publishEligible:
          type: boolean
          description: Coverage prerequisite for publishing the booking page
      required:
        - configured
        - isActive
        - countryCode
        - provinceCode
        - city
        - publicDescription
        - prefixes
        - bufferMinutes
        - bufferSource
        - publishEligible

    MyServiceAreaResponse:
      type: object
      properties:
        serviceArea:
          $ref: "#/components/schemas/MyServiceArea"
      required:
        - serviceArea

    UpdateServiceAreaRequest:
      type: object
      properties:
        countryCode:
          type: string
          description: Only "CA" is accepted in this release (defaults to CA)
        provinceCode:
          type: string
          description: Canadian province/territory code or name
        city:
          type: string
          nullable: true
        publicDescription:
          type: string
          nullable: true
          maxLength: 500
        isActive:
          type: boolean
      required:
        - provinceCode

    AddServiceAreaPrefixRequest:
      type: object
      properties:
        prefix:
          type: string
          description: Three-character Canadian FSA (e.g. "M5V") or a full postal code
      required:
        - prefix

    ServiceAreaPrefixResponse:
      type: object
      properties:
        prefix:
          $ref: "#/components/schemas/MyServiceAreaPrefix"
      required:
        - prefix

    PublicBookingPageResponse:
      type: object
      properties:
        page:
          $ref: "#/components/schemas/PublicBookingPage"
      required:
        - page

    ProviderSlot:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        available:
          type: boolean
      required:
        - start
        - end
        - available

    ProviderSlotsResponse:
      type: object
      properties:
        timezone:
          type: string
          description: Effective IANA marketplace timezone
        date:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSlot"
      required:
        - timezone
        - date
        - slots

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - bookings
        - total
        - limit
        - offset

    CreateBookingRequest:
      type: object
      properties:
        providerId:
          type: integer
          description: provider_profiles.id
        serviceId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postalCode:
          type: string
        careNotes:
          type: string
        clientNotes:
          type: string
        source:
          type: string
          enum: [instagram, qr-card, text, facebook, website]
          description: >-
            Optional allowlisted acquisition-source attribution (provider
            booking-page share links). Unknown values are dropped server-side;
            never used for authorization or pricing.
      required:
        - providerId
        - serviceId
        - scheduledAt
        - address
        - city

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        cancellationReason:
          type: string
          description: >-
            Required when transitioning to cancelled. Private free text —
            support/admin-visible only, never shared cross-party
        reasonCategory:
          type: string
          enum: [illness, emergency, schedule_conflict, client_request, declined_request, reschedule_declined, other]
          description: >-
            Required when a PROVIDER cancels (roadmap #13). Allowlisted
            structured reason shared with the client
        scheduledAt:
          type: string
          format: date-time
          description: Required when transitioning to rescheduled
      required:
        - status

    # ── Cancellation/no-show policy schemas (roadmap #13) ─────────────────────

    CancellationPreviewResponse:
      type: object
      properties:
        preview:
          type: object
          properties:
            outcome:
              type: string
              enum: [free, late, provider, unavailable]
            noticeHours:
              type: integer
            freeUntil:
              type: string
              format: date-time
              nullable: true
            message:
              type: string
          required: [outcome, noticeHours, freeUntil, message]
      required: [preview]

    OutcomeHistoryEntry:
      type: object
      description: >-
        Append-only outcome record. Private fields (reasonSnapshot,
        actorUserId) are present only in admin responses
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        actorRole:
          type: string
          enum: [client, provider, admin]
        action:
          type: string
          enum: [cancelled, no_show, support_corrected]
        category:
          type: string
          nullable: true
        reasonCategory:
          type: string
          nullable: true
        previousStatus:
          $ref: "#/components/schemas/BookingStatus"
        newStatus:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          format: date-time
      required: [id, bookingId, actorRole, action, category, reasonCategory, previousStatus, newStatus, createdAt]

    OutcomeHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeHistoryEntry"
        limit:
          type: integer
      required: [history, limit]

    # ── Support workflow schemas (minimal, API-first — roadmap #13) ───────────

    CreateEscalationRequest:
      type: object
      properties:
        bookingId:
          type: integer
        message:
          type: string
          maxLength: 2000
          description: Optional opening message recorded on the ticket
      required: [bookingId]

    EscalationTicket:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
          nullable: true
        subject:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, bookingId, subject, status, createdAt, updatedAt]

    SupportContactResponse:
      type: object
      required: [contact]
      properties:
        contact:
          type: object
          required: [url, label, isPlaceholder]
          properties:
            url:
              type: string
              description: "mailto: or http(s) link for reaching support"
            label:
              type: string
              description: Human-readable label (the email address, or a generic label for URLs)
            isPlaceholder:
              type: boolean
              description: True when no SUPPORT_CONTACT_* environment override is configured (pilot placeholder)

    EscalationResponse:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/EscalationTicket"
        created:
          type: boolean
          description: True when a new ticket was created; false for idempotent replays
      required: [ticket]

    SupportBookingEscalationsResponse:
      type: object
      description: Internal support view — never exposed to regular clients/providers
      properties:
        booking:
          type: object
          properties:
            id:
              type: integer
            status:
              $ref: "#/components/schemas/BookingStatus"
            scheduledAt:
              type: string
              format: date-time
            cancellationCategory:
              type: string
              nullable: true
            cancellationReason:
              type: string
              nullable: true
            noShowMarkedAt:
              type: string
              format: date-time
              nullable: true
          required: [id, status, scheduledAt, cancellationCategory, cancellationReason, noShowMarkedAt]
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTicket"
        history:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeHistoryEntry"
      required: [booking, tickets, history]

    UpdateEscalationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved]
        resolutionNote:
          type: string
          maxLength: 2000
          description: Mediation outcome — recorded as a support message
        correction:
          type: object
          description: >-
            Correct a disputed cancelled/no-show booking outcome. Appends a
            support_corrected history row; never mutates existing history
          properties:
            status:
              type: string
              enum: [completed, cancelled]
            reason:
              type: string
          required: [status, reason]
        suspendUserId:
          type: integer
          description: >-
            Trigger the existing account suspension mechanism for a party to
            the linked booking

    # ── Reschedule proposal schemas (consent-first provider rescheduling) ─────

    RescheduleProposalStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired, unresolved]

    RescheduleProposal:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        requesterRole:
          type: string
          enum: [client, provider, admin]
        originalScheduledAt:
          type: string
          format: date-time
        proposedScheduledAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/RescheduleProposalStatus"
        deadlineAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - bookingId
        - requesterRole
        - originalScheduledAt
        - proposedScheduledAt
        - status
        - deadlineAt
        - createdAt

    CreateRescheduleRequest:
      type: object
      properties:
        proposedScheduledAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 500
        idempotencyKey:
          type: string
          maxLength: 128
      required:
        - proposedScheduledAt
        - idempotencyKey

    RescheduleProposalResponse:
      type: object
      properties:
        proposal:
          $ref: "#/components/schemas/RescheduleProposal"
      required:
        - proposal

    RescheduleProposalListResponse:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/RescheduleProposal"
      required:
        - proposals

    AcceptRescheduleResponse:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        proposal:
          $ref: "#/components/schemas/RescheduleProposal"
      required:
        - booking
        - proposal

    DeclineRescheduleResponse:
      type: object
      properties:
        proposal:
          $ref: "#/components/schemas/RescheduleProposal"
        originalTimeFeasible:
          type: boolean
        supportMessage:
          type: string
      required:
        - proposal
        - originalTimeFeasible

    RescheduleHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        originalScheduledAt:
          type: string
          format: date-time
        newScheduledAt:
          type: string
          format: date-time
        requesterRole:
          type: string
          enum: [client, provider, admin]
        reason:
          type: string
          nullable: true
        previousStatus:
          $ref: "#/components/schemas/BookingStatus"
        newStatus:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - originalScheduledAt
        - newScheduledAt
        - requesterRole
        - previousStatus
        - newStatus
        - createdAt

    ReschedulingHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/RescheduleHistoryEntry"
        limit:
          type: integer
        nextCursor:
          type: integer
          nullable: true
      required:
        - history
        - limit

    # ── Review Schemas (create/get) ────────────────────────────────────────────

    ReviewResponse:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/Review"
      required:
        - review

    CreateReviewRequest:
      type: object
      properties:
        bookingId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
      required:
        - bookingId
        - rating

    # ── Invoice Schemas ────────────────────────────────────────────────────────

    InvoiceStatus:
      type: string
      enum: [pending, paid, cancelled]

    Invoice:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        clientId:
          type: integer
        providerId:
          type: integer
        amountCents:
          type: integer
          description: Amount in cents (CAD)
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - clientId
        - providerId
        - amountCents
        - status

    InvoiceResponse:
      type: object
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
      required:
        - invoice

    InvoiceListResponse:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - invoices
        - total
        - limit
        - offset

    # ── Earnings Schemas ───────────────────────────────────────────────────────

    EarningsSummaryResponse:
      type: object
      properties:
        totalCents:
          type: integer
          description: Lifetime earnings in cents
        completedBookings:
          type: integer
        pendingPayoutCents:
          type: integer
          description: Placeholder — Stripe Connect not yet active
      required:
        - totalCents
        - completedBookings
        - pendingPayoutCents

    EarningsExportItem:
      type: object
      properties:
        bookingId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        clientFirstName:
          type: string
        clientLastName:
          type: string
        serviceTitle:
          type: string
        amountCents:
          type: integer
      required:
        - bookingId
        - scheduledAt
        - clientFirstName
        - clientLastName
        - serviceTitle
        - amountCents

    EarningsExportResponse:
      type: object
      properties:
        provider:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            title:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
          required:
            - firstName
            - lastName
        generatedAt:
          type: string
          format: date-time
        totalCents:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/EarningsExportItem"
      required:
        - provider
        - generatedAt
        - totalCents
        - count
        - items

    # ── Provider Dashboard Schemas (owner-scoped, read-only) ───────────────────

    ProviderDashboardBooking:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        clientName:
          type: string
          description: Privacy-trimmed client label (first name + last initial)
        serviceName:
          type: string
        location:
          type: string
          description: FSA/postal prefix when available, otherwise city — never the full address
        status:
          type: string
          enum: [requested, confirmed, rescheduled]
      required:
        - id
        - date
        - clientName
        - serviceName
        - location
        - status

    ProviderPerformanceMetrics:
      type: object
      properties:
        completionRate:
          type: number
          description: completed / resolved bookings (0–1); 0 when nothing is resolved
        cancellationRate:
          type: number
          description: cancelled / resolved bookings (0–1)
        noShowRate:
          type: number
          description: no-shows / resolved bookings (0–1)
        repeatClientRate:
          type: number
          description: Share of clients with a completed booking who completed at least twice (0–1)
        totalBookings:
          type: integer
        completedBookings:
          type: integer
        cancelledBookings:
          type: integer
        noShowBookings:
          type: integer
        resolvedBookings:
          type: integer
          description: completed + cancelled + no_show — the denominator for all rates
      required:
        - completionRate
        - cancellationRate
        - noShowRate
        - repeatClientRate
        - totalBookings
        - completedBookings
        - cancelledBookings
        - noShowBookings
        - resolvedBookings

    ProviderSourceAttribution:
      type: object
      description: >-
        Booking counts grouped by allowlisted acquisition source (`qr-card`
        is exposed as `qrCard`). `unknown` counts bookings recorded without
        attribution; `other` is reserved for future allowlist growth.
      properties:
        instagram:
          type: integer
        qrCard:
          type: integer
        text:
          type: integer
        facebook:
          type: integer
        website:
          type: integer
        other:
          type: integer
        unknown:
          type: integer
      required:
        - instagram
        - qrCard
        - text
        - facebook
        - website
        - other
        - unknown

    ProviderActivityItem:
      type: object
      properties:
        type:
          type: string
          enum: [booking, reschedule, cancellation, no_show]
        date:
          type: string
          format: date-time
          description: When the booking last changed (booking updatedAt)
        clientName:
          type: string
          description: Privacy-trimmed client label (first name + last initial)
        serviceName:
          type: string
        status:
          type: string
      required:
        - type
        - date
        - clientName
        - serviceName
        - status

    ProviderEarningsPreview:
      type: object
      properties:
        estimatedMonthlyCents:
          type: integer
          nullable: true
          description: >-
            Sum of service prices for bookings completed this month (marketplace
            timezone); null when nothing completed this month. Estimate only —
            payments are not enabled and no money moves through the platform.
        available:
          type: boolean
          description: Always false until payments are enabled
      required:
        - estimatedMonthlyCents
        - available

    ProviderDashboardResponse:
      type: object
      properties:
        providerId:
          type: integer
        providerName:
          type: string
        slug:
          type: string
          nullable: true
        bookingPagePublished:
          type: boolean
        bookingUrl:
          type: string
          nullable: true
          description: Canonical public booking path (/book/:slug) when published, otherwise null
        todayBookingsCount:
          type: integer
        nextBooking:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            date:
              type: string
              format: date-time
            clientName:
              type: string
            serviceName:
              type: string
            location:
              type: string
            status:
              type: string
              enum: [requested, confirmed, rescheduled]
          required:
            - id
            - date
            - clientName
            - serviceName
            - location
            - status
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/ProviderDashboardBooking"
        metrics:
          $ref: "#/components/schemas/ProviderPerformanceMetrics"
        sourceAttribution:
          $ref: "#/components/schemas/ProviderSourceAttribution"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ProviderActivityItem"
        earningsPreview:
          $ref: "#/components/schemas/ProviderEarningsPreview"
        updatedAt:
          type: string
          format: date-time
      required:
        - providerId
        - providerName
        - slug
        - bookingPagePublished
        - bookingUrl
        - todayBookingsCount
        - nextBooking
        - upcomingBookings
        - metrics
        - sourceAttribution
        - recentActivity
        - earningsPreview
        - updatedAt

    ProviderMetricsResponse:
      type: object
      properties:
        metrics:
          $ref: "#/components/schemas/ProviderPerformanceMetrics"
        updatedAt:
          type: string
          format: date-time
      required:
        - metrics
        - updatedAt

    # ── Verification / Credential Schemas ──────────────────────────────────────

    VerificationDocStatus:
      type: string
      enum: [pending, approved, rejected]

    VerificationDoc:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        docType:
          type: string
          description: e.g. "license", "insurance", "certification", "other"
        fileName:
          type: string
          description: URL or descriptive reference to the credential document
        status:
          $ref: "#/components/schemas/VerificationDocStatus"
        reviewerNotes:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - providerId
        - docType
        - fileName
        - status
        - submittedAt

    VerificationDocResponse:
      type: object
      properties:
        doc:
          $ref: "#/components/schemas/VerificationDoc"
      required:
        - doc

    VerificationStatusResponse:
      type: object
      properties:
        verificationStatus:
          type: string
          enum: [pending, under_review, approved, rejected]
        docs:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDoc"
      required:
        - verificationStatus
        - docs

    SubmitVerificationDocRequest:
      type: object
      properties:
        docType:
          type: string
          enum: [license, insurance, certification, other]
        fileName:
          type: string
          minLength: 3
          maxLength: 200
          description: URL or descriptive reference to the document
        notes:
          type: string
          maxLength: 1000
          description: Optional context for the reviewer
      required:
        - docType
        - fileName

    AdminVerificationQueueItem:
      type: object
      properties:
        doc:
          $ref: "#/components/schemas/VerificationDoc"
        provider:
          type: object
          properties:
            id:
              type: integer
            userId:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            city:
              type: string
            verificationStatus:
              type: string
          required:
            - id
            - userId
            - firstName
            - lastName
            - email
            - city
            - verificationStatus
      required:
        - doc
        - provider

    AdminVerificationQueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminVerificationQueueItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    ReviewVerificationDocRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/VerificationDocStatus"
        reviewerNotes:
          type: string
        updateProviderStatus:
          type: string
          enum: [pending, under_review, approved, rejected]
          description: Optionally update the provider's overall verification status
      required:
        - status

    # ── Reviewer Decision Schemas (admin only) ─────────────────────────────────

    ApproveProviderApplicationRequest:
      type: object
      properties:
        reviewerNotes:
          type: string
          description: Optional reviewer-private notes. Never exposed to providers.

    RejectProviderApplicationRequest:
      type: object
      properties:
        rejectionReason:
          type: string
          minLength: 1
