  # ── Bookings ─────────────────────────────────────────────────────────────────

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List own bookings (scoped by role)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, confirmed, completed, cancelled, rescheduled, no_show]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request (client only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: The booking request was rejected before creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestRejectedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested time conflicts with an existing booking
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DuplicateBookingConflictResponse"
                  - $ref: "#/components/schemas/ProviderUnavailableConflictResponse"

