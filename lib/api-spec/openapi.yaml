        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
        priceCents:
          type: integer
          minimum: 0
        category:
          type: string
        eligibilityNotes:
          type: string
        isActive:
          type: boolean

    # ── Availability Schemas ───────────────────────────────────────────────────

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: integer
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = Sunday, 6 = Saturday"
        startTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        endTime:
          type: string
          description: "HH:MM 24-hour"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      required:
        - id
        - dayOfWeek
        - startTime
        - endTime

    AvailabilityListResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
      required:
        - slots

    SetAvailabilityRequest:
      type: object
      description: Replaces all availability slots for the provider
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              startTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              endTime:
                type: string
                pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
            required:
