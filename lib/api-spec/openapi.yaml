        id:
          type: integer
        userId:
          type: integer
        providerProfileId:
          type: integer
        status:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: integer
          nullable: true
        reviewerNotes:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - providerProfileId
        - status
        - currentStep
        - submittedAt
        - reviewedAt
        - reviewedBy
        - reviewerNotes
        - rejectionReason
        - createdAt
        - updatedAt

    AdminProviderApplicationResponse:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/AdminProviderApplicationView"
      required:
        - application
