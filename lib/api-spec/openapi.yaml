components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRole:
      type: string
      enum: [client, provider, admin]

    ProviderApplicationStatus:
      type: string
      enum: [draft, under_review, approved, rejected, suspended]

    ProviderApplicationStep:
      type: string
      enum: [profile, services, availability, verification, submitted]

    ProviderApplicationState:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - status
        - currentStep
        - submittedAt
        - reviewedAt

    ProviderApplicationProfile:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        bio:
          type: string
          nullable: true
        city:
          type: string
        serviceAreaNotes:
          type: string
          nullable: true
        yearsExperience:
          type: integer
          nullable: true
        profileComplete:
          type: boolean
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
      required:
        - id
        - title
        - bio
        - city
        - serviceAreaNotes
        - yearsExperience
        - profileComplete
        - verificationStatus

    ProviderApplicationPreviousSubmission:
      type: object
      description: |
        Immutable snapshot of a closed submission cycle. Written only when the
        owner resets a `rejected` application back to `draft`. Reviewer-private
        content (`reviewerNotes`) is never exposed here; only provider-visible
        fields are returned.
      properties:
        id:
          type: integer
        outcome:
          type: string
          enum: [rejected]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - outcome
        - submittedAt
        - reviewedAt
        - rejectionReason
        - createdAt

    ProviderApplicationNextAction:
      type: string
      enum:
        - resume_draft
        - wait_for_review
        - provider_operations_available
        - reset_to_draft
        - contact_support

    ProviderApplicationStatusView:
      type: object
      description: |
        Compact owner-scoped status projection of a provider application.
        Only exposes provider-visible fields; `reviewerNotes` never appears.
      properties:
        applicationId:
          type: integer
        status:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        submissionCount:
          type: integer
          minimum: 0
        latestSubmission:
          allOf:
            - $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
          nullable: true
        nextAction:
          $ref: "#/components/schemas/ProviderApplicationNextAction"
        canEdit:
          type: boolean
        canReset:
          type: boolean
        canResubmit:
          type: boolean
      required:
        - applicationId
        - status
        - currentStep
        - submittedAt
        - reviewedAt
        - rejectionReason
        - submissionCount
        - latestSubmission
        - nextAction
        - canEdit
        - canReset
        - canResubmit

    ProviderApplicationStatusResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ProviderApplicationStatusView"
      required:
        - status

    ProviderApplicationSubmissionsPagination:
      type: object
      description: Keyset pagination envelope for submission history.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - limit
        - hasMore
        - nextCursor

    ProviderApplicationSubmissionHistoryResponse:
      type: object
      description: |
        Owner-scoped submission history. `summary` is the same status
        projection returned by `GET /providers/application/status`;
        `submissions` is the newest-first, keyset-paginated list of closed
        rejected cycles.
      properties:
        summary:
          $ref: "#/components/schemas/ProviderApplicationStatusView"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
        pagination:
          $ref: "#/components/schemas/ProviderApplicationSubmissionsPagination"
      required:
        - summary
        - submissions
        - pagination

    ProviderNotification:
      type: object
      description: In-app provider notification derived from a lifecycle event.
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - submitted
            - reset_to_draft
            - approved
            - rejected
        title:
          type: string
        body:
          type: string
        link:
          type: string
          description: Provider-safe relative in-app path.
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - body
        - link
        - readAt
        - createdAt

    ProviderNotificationsPagination:
      type: object
      description: Keyset pagination envelope for notifications.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - limit
        - hasMore
        - nextCursor

    ProviderNotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/ProviderNotification"
        pagination:
          $ref: "#/components/schemas/ProviderNotificationsPagination"
      required:
        - notifications
        - pagination

    ProviderNotificationUnreadCountResponse:
      type: object
      properties:
        unreadCount:
          type: integer
      required:
        - unreadCount

    ProviderNotificationReadResponse:
      type: object
      properties:
        notification:
          $ref: "#/components/schemas/ProviderNotification"
      required:
        - notification

    ProviderApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ProviderApplicationState"
        - type: object
          properties:
            providerProfileId:
              type: integer
            profile:
              $ref: "#/components/schemas/ProviderApplicationProfile"
            rejectionReason:
              type: string
              nullable: true
              description: Provider-visible reason present while `status` is `rejected`. Cleared on reset back to `draft`; historical values remain in `previousSubmissions`.
            previousSubmissions:
              type: array
              description: Immutable history of closed submission cycles, ordered oldest to newest.
              items:
                $ref: "#/components/schemas/ProviderApplicationPreviousSubmission"
          required:
            - providerProfileId
            - profile
            - rejectionReason
            - previousSubmissions

    ProviderApplicationDetailResponse:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/ProviderApplicationDetail"
      required:
        - application

    UpdateProviderApplicationRequest:
      type: object
      properties:
        currentStep:
          $ref: "#/components/schemas/ProviderApplicationStep"
        title:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
          maxLength: 2000
        city:
          type: string
          minLength: 1
          maxLength: 120
        serviceAreaNotes:
          type: string
          maxLength: 2000
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 80

    ApplicationCompletion:
      type: object
      properties:
        profileComplete:
          type: boolean
        servicesComplete:
          type: boolean
        availabilityComplete:
          type: boolean
        verificationComplete:
          type: boolean
        readyForSubmission:
          type: boolean
        applicationStatus:
          $ref: "#/components/schemas/ProviderApplicationStatus"
        missingRequirements:
          type: array
          items:
            type: string
          description: Human-readable list of missing required sections
      required:
        - profileComplete
        - servicesComplete
        - availabilityComplete
        - verificationComplete
        - readyForSubmission
        - applicationStatus
        - missingRequirements

    ApplicationCompletionResponse:
      type: object
      properties:
        completion:
          $ref: "#/components/schemas/ApplicationCompletion"
      required:
        - completion

    ProviderReadinessMissingCode:
      type: string
      description: >-
        Stable activation-readiness reason codes. Mirrors the readiness
        subset of the marketplace_event_reason_code enum; values are
        additive-only and never renamed or removed.
      enum:
        - NOT_APPROVED
        - PROFILE_INCOMPLETE
        - NO_ACTIVE_SERVICE
        - NO_AVAILABILITY
        - NO_SERVICE_AREA
        - NOT_ACCEPTING_CLIENTS
        - DOCS_PENDING

    ProviderReadinessCriteria:
      type: object
      description: Per-criterion activation booleans (C1–C7), each computed live from raw source fields.
      properties:
        approved:
          type: boolean
          description: C1 — provider application approved and profile verification approved
        profileComplete:
          type: boolean
          description: C2 — non-empty title, city, and bio, computed live (the stored profileComplete flag is never trusted)
        activeService:
          type: boolean
          description: C3 — at least one active service
        availability:
          type: boolean
          description: C4 — at least one availability slot
        serviceArea:
          type: boolean
          description: C5 — at least one travel zone (service area)
        acceptingClients:
          type: boolean
          description: C6 — provider is accepting new clients
        documents:
          type: boolean
          description: C7 — every platform-mandated document type has an approved verification document; auto-satisfied when no document type is mandated
      required:
        - approved
        - profileComplete
        - activeService
        - availability
        - serviceArea
        - acceptingClients
        - documents

    ProviderReadiness:
      type: object
      properties:
        activated:
          type: boolean
          description: Logical AND of criteria C1–C7
        missing:
          type: array
          description: Reason codes for unmet criteria, in deterministic C1→C7 order
          items:
            $ref: "#/components/schemas/ProviderReadinessMissingCode"
        criteria:
          $ref: "#/components/schemas/ProviderReadinessCriteria"
      required:
        - activated
        - missing
        - criteria

    ProviderReadinessResponse:
      type: object
      properties:
        readiness:
          $ref: "#/components/schemas/ProviderReadiness"
      required:
        - readiness

    OnboardingState:
      type: object
      properties:
        client:
          type: string
          enum: [complete]
          nullable: true
        provider:
          $ref: "#/components/schemas/ProviderApplicationStatus"
          nullable: true
      required:
        - client
        - provider

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
          minItems: 1
        activeRole:
          $ref: "#/components/schemas/UserRole"
        onboarding:
          $ref: "#/components/schemas/OnboardingState"
        providerApplication:
          allOf:
            - $ref: "#/components/schemas/ProviderApplicationState"
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - role
        - roles
        - activeRole
        - onboarding
        - providerApplication
        - firstName
        - lastName

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          type: string
          enum: [client, provider]
          default: client
        roleIntent:
          type: string
          enum: [client, provider]
          description: Signup intent. The server derives initial membership and never treats this field as ongoing authorization.
        phone:
          type: string
      required:
        - email
        - password
        - firstName
        - lastName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - token
        - user

    MeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: object
              properties:
                isActive:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
      required:
        - user

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - error

    # ── Provider Schemas ───────────────────────────────────────────────────────

    VerificationStatus:
      type: string
