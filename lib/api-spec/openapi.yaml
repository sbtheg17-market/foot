        scheduledAt:
          type: string
          format: date-time
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postalCode:
          type: string
        careNotes:
          type: string
        clientNotes:
          type: string
      required:
        - providerId
        - serviceId
        - scheduledAt
        - address
        - city

    UpdateBookingStatusRequest:
