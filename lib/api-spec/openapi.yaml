          type: integer
        providerId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        durationMinutes:
          type: integer
        priceCents:
          type: integer
          description: Price in cents (CAD)
        category:
          type: string
        eligibilityNotes:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
