openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: OnCall Foot API — foot rejuvenation marketplace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: providers
    description: Provider discovery and provider portal
  - name: bookings
    description: Booking lifecycle
  - name: reviews
    description: Client reviews
  - name: invoices
    description: Payment invoices

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (client drops the token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Provider Discovery (public) ──────────────────────────────────────────────

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: Browse providers
      description: Public provider discovery with optional filters
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city (case-insensitive partial match)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by service category
        - name: verified
          in: query
          schema:
            type: boolean
          description: Only return verified providers
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"

  /providers/application:
    get:
      operationId: getProviderApplication
      tags: [providers]
      summary: Get the authenticated user's provider application
      description: Returns the owner's provider application and onboarding profile data. This does not grant provider operations.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProviderApplication
      tags: [providers]
      summary: Start or resume provider onboarding
      description: Idempotently creates provider membership, a provider profile, and a draft application for the authenticated client. It never changes the active role or grants provider operations.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing provider application resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "201":
          description: Provider application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      operationId: updateProviderApplication
      tags: [providers]
      summary: Save provider onboarding progress
      description: Updates the authenticated owner's draft provider application and profile data. Submitted applications cannot be edited through this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderApplicationRequest"
      responses:
        "200":
          description: Provider application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/application/reset:
    post:
      operationId: resetProviderApplication
      tags: [providers]
      summary: Reset a rejected provider application back to draft
      description: |
        Transitions the authenticated owner's application from `rejected` back to `draft`
        so it can be edited and resubmitted. Snapshots the closed submission cycle
        (submittedAt, reviewedAt, reviewer identity, private reviewer notes, and the
        provider-visible rejection reason) into an immutable history record before
        clearing those fields on the main row. Idempotent: calling reset on an
        application that is already `draft` returns the current state without change.
        Applications in `under_review`, `approved`, or `suspended` cannot be reset.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider application draft state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/application/submit:
    post:
      operationId: submitProviderApplication
      tags: [providers]
      summary: Submit a provider application for review
      description: |
        Moves the authenticated owner's draft application to `under_review` after
        required profile fields are present. Applications in `rejected` state must
        first be reset via `/providers/application/reset`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/application/status:
    get:
      operationId: getProviderApplicationStatus
      tags: [providers]
      summary: Server-authoritative status view for the owner's application
      description: |
        Compact, owner-scoped status view. Includes the current `status`,
        current-cycle `submittedAt`/`reviewedAt`, the provider-visible
        `rejectionReason` (nullable), a `submissionCount` derived from the
        immutable history, the most-recent closed submission summary
        (`latestSubmission`), a server-derived `nextAction` guidance value,
        and server-derived `canEdit`/`canReset`/`canResubmit` capability
        flags. Reviewer-private `reviewerNotes` is never included.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider application status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/application/submissions:
    get:
      operationId: getProviderApplicationSubmissions
      tags: [providers]
      summary: Paginated history of the owner's closed submission cycles
      description: |
        Owner-scoped, keyset-paginated history of the authenticated provider's
        closed application submission cycles, newest first. Each item exposes
        only provider-visible fields; reviewer-private material is never
        returned.

        Honesty note: `submissions` contains closed **rejected** cycles only,
        snapshotted at the moment the owner resets a rejected application back
        to draft. The current open cycle is not a history row — it is reflected
        in `summary`. This endpoint is therefore not a complete persisted
        lifecycle event log (submitted/under_review/approved transitions are
        not recorded here).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned as `nextCursor` by a prior page.
      responses:
        "200":
          description: Submission history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderApplicationSubmissionHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/notifications:
    get:
      operationId: getProviderNotifications
      tags: [providers]
      summary: Owner-scoped, newest-first in-app notifications (paginated)
      description: |
        In-app provider notifications generated from application lifecycle
        events, newest first, keyset-paginated. Owner-scoped to the
        authenticated provider; reviewer-private material is never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned as `nextCursor` by a prior page.
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderNotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/notifications/unread-count:
    get:
      operationId: getProviderNotificationUnreadCount
      tags: [providers]
      summary: Count of the owner's unread notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderNotificationUnreadCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/notifications/{id}/read:
    post:
      operationId: markProviderNotificationRead
      tags: [providers]
      summary: Mark one owned notification as read (idempotent)
      description: |
        Owner-only and non-enumerating: a notification that does not exist or
        is owned by another user returns 404 without disclosing which.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The notification after marking it read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderNotificationReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/application/completion:
    get:
      operationId: getProviderApplicationCompletion
      tags: [providers]
      summary: Get server-derived completion summary for the provider application
      description: Returns a completion status for each required onboarding section. The server calculates all flags — do not trust client-side values for authorization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Application completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/application/services:
    get:
      operationId: listApplicationServices
      tags: [providers]
      summary: List draft services for the provider application
      description: Returns services associated with the provider's profile during onboarding. Does not require an approved application.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApplicationService
      tags: [providers]
      summary: Add a service to the provider application
      description: Adds a service during onboarding. Does not require an approved application; application must be in draft or rejected status.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/application/services/{serviceId}:
    patch:
      operationId: updateApplicationService
      tags: [providers]
      summary: Update a draft service in the provider application
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Updated draft service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteApplicationService
      tags: [providers]
      summary: Remove a draft service from the provider application
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/application/availability:
    get:
      operationId: getApplicationAvailability
      tags: [providers]
      summary: Get availability schedule for the provider application
      description: Returns the provider's availability slots during onboarding. Does not require an approved application.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Availability slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setApplicationAvailability
      tags: [providers]
      summary: Set availability schedule for the provider application
      description: Replaces all availability slots during onboarding. Does not require an approved application; application must be in draft or rejected status.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityRequest"
      responses:
        "200":
          description: Updated availability slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /providers/me:
    get:
      operationId: getMyProviderProfile
      tags: [providers]
      summary: Get own provider profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyProviderProfile
      tags: [providers]
      summary: Update own provider profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/me/readiness:
    get:
      operationId: getMyProviderReadiness
      tags: [providers]
      summary: Get own provider activation readiness
      description: >-
        Owner-scoped activation readiness for the authenticated provider
        member. The server computes the C1–C7 activation criteria live from
        raw source fields on every request — stored roll-up flags such as
        profileComplete are never trusted. Unapproved providers can read
        their own readiness. `missing` lists stable reason codes for unmet
        criteria in deterministic C1→C7 order; `activated` is the logical
        AND of all seven criteria. Read-only — nothing is persisted and no
        event is emitted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activation readiness for the authenticated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/booking-page:
    get:
      operationId: getMyBookingPage
      tags: [providers]
      summary: Owner-scoped public booking-page state (slug + publish state)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Booking-page state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBookingPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/booking-page/publish:
    post:
      operationId: publishMyBookingPage
      tags: [providers]
      summary: Publish the provider's canonical public booking page (approved providers only)
      description: >-
        Assigns a globally unique lowercase kebab-case slug from the provider
        display name on first publish (deterministic safe suffix on collision;
        not provider-editable afterwards) and makes /book/{slug} publicly
        reachable. Idempotent when already published.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Booking-page state after publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBookingPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/booking-page/unpublish:
    post:
      operationId: unpublishMyBookingPage
      tags: [providers]
      summary: Unpublish the provider's public booking page (removes public access; data retained)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Booking-page state after unpublish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBookingPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /booking-pages/{slug}:
    get:
      operationId: getPublicBookingPage
      tags: [booking-pages]
      summary: Public provider booking page by slug (published, approved providers only)
      description: >-
        Canonical provider-owned public booking surface. Missing, unpublished,
        inactive, and format-invalid slugs all return the same generic
        non-leaking 404. Derives profile, services, and availability from the
        same source of truth as marketplace discovery; booking uses the
        existing slots and bookings endpoints via the returned provider id.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public booking page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /booking-pages/{slug}/service-area-check:
    post:
      operationId: checkBookingPageServiceArea
      tags: [booking-pages]
      summary: Public service-area eligibility check for a booking page (roadmap #12)
      description: >-
        Server-authoritative eligibility for the provider-owned public booking
        page. Returns ONLY a safe eligibility state, the approved public
        message, and an allowlisted reason code — never raw coverage entries
        or provider-private data. Client location input is validated minimally
        and NOT retained. Missing, unpublished, unapproved, and format-invalid
        slugs return the same generic non-leaking 404 as the page itself.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAreaCheckRequest"
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAreaCheckResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{providerId}/service-area-check:
    post:
      operationId: checkProviderServiceArea
      tags: [providers]
      summary: Public service-area eligibility check for the marketplace flow (roadmap #12)
      description: >-
        Same server-authoritative evaluation as the booking-page check, keyed
        by public provider id for the existing marketplace booking flow.
        Providers without active coverage report `unavailable` with reason
        `not_configured` (marketplace booking then proceeds under legacy
        behavior — enforcement starts once the provider configures coverage).
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAreaCheckRequest"
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAreaCheckResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/me/listing-preview:
    get:
      operationId: getMyListingPreview
      tags: [providers]
      summary: Owner-scoped preview of the provider's public marketplace listing
      description: >-
